site_name: 硬件自学指南
site_description: 浙江大学 RM 战队 · 面向零基础的硬件学习指南
site_author: 浙江大学 RM 战队 26 赛季硬件组
copyright: 浙江大学 RM 战队 · 内部培训资料 · 禁止外传
theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/chip
  palette:
  - scheme: default
    primary: teal
    accent: teal
    toggle:
      icon: material/weather-night
      name: 切换深色模式
  - scheme: slate
    primary: teal
    accent: teal
    toggle:
      icon: material/weather-sunny
      name: 切换浅色模式
  features:
  - navigation.top
  - navigation.footer
  - search.highlight
  - search.suggest
  - content.code.copy
plugins:
- search:
    lang:
    - zh
    - en
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
    toc_depth: 3
- pymdownx.superfences
- pymdownx.betterem
- pymdownx.arithmatex:
    generic: true
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/mathjax.js
- assets/mathjax/tex-chtml.js
nav:
- 开始阅读: index.md
- 学习路线: roadmap.md
- 数理基础:
  - 微积分 I: chapters/ch01.md
  - 微积分 II: chapters/ch02.md
  - 常微分方程: chapters/ch03.md
  - 大学物理电磁学: chapters/ch04.md
- 电路与电子:
  - 电路分析: chapters/ch05.md
  - 模拟电子技术: chapters/ch06.md
  - 数字电子技术: chapters/ch08.md
- 工艺与制造:
  - 工艺与工艺参数: chapters/ch23.md
- 电力电子与电源:
  - 电力电子技术: chapters/ch13.md
  - 开关电源: chapters/ch14.md
  - 电源分析: chapters/ch15.md
  - 热分析: chapters/ch16.md
- 微机与编程:
  - 微机接口与微处理器: chapters/ch17.md
  - C 语言: chapters/ch18.md
  - C++ 语言: chapters/ch19.md
- 专业进阶模块:
  - 自动控制原理: chapters/ch12.md
  - 概率论与数理统计: chapters/ch07.md
  - 电磁场与电磁波: chapters/ch09.md
  - 信号与系统: chapters/ch10.md
  - 通信基础与原理: chapters/ch11.md
  - 汇编: chapters/ch20.md
  - 信号完整性分析: chapters/ch21.md
  - 电磁兼容: chapters/ch22.md
  - 偏微分方程: chapters/ch24.md
- 编写说明: about.md
